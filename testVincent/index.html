<!doctype html>
<html lang="en">
  <head>
    <title>Vincent</title>
    <meta charset="utf-8">
    <meta name="description" content="&lt;model-viewer&gt; template">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link type="text/css" href="./styles.css" rel="stylesheet"/>
  </head>
  <body>
    <!-- <model-viewer> HTML element -->
    <model-viewer src="梵谷杯.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="poster.webp" shadow-intensity="1" auto-rotate scale="0.6 0.6 0.6" orientation="0deg 45deg 180deg">
	<extra-model src="tigerx100.glb" offset="1 0 0"></extra-model>
	<extra-model src="tiger.glb" offset="0 1 0" scale="0.1 0.1 0.1" orientation="100 0 0"></extra-model>
	
      <button class="Hotspot" slot="hotspot-1" data-position="0.046709194207842725m -0.22213362132019077m -0.15004082717479483m" data-normal="-0.25899940652931014m -0.8047591283877114m -0.5341180138266415m" data-visibility-attribute="visible">
          <div class="HotspotAnnotation">Vincent</div>
      </button>
      <div class="progress-bar hide" slot="progress-bar">
          <div class="update-bar"></div>
      </div>
      <button slot="ar-button" id="ar-button">
          View in your space
      </button>
      <div id="ar-prompt">
          <img src="ar_hand_prompt.png">
      </div>
    </model-viewer>  
    <script src="script.js"></script>
    <!-- Loads <model-viewer> for browsers: -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  </body>
</html>
